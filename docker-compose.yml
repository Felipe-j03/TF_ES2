services:
  moodle-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD}
    volumes:
      - moodle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      retries: 20

  moodle:
    image: erseco/alpine-moodle:v5.2.3
    depends_on:
      moodle-db:
        condition: service_healthy
    environment:
      DB_TYPE: pgsql
      DB_HOST: moodle-db
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: ${MOODLE_DB_PASSWORD}
      SITE_URL: http://localhost:8080
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL}
      # O script de configuração da imagem não aceita espaços aqui
      MOODLE_SITENAME: Moodle-Reengajamento
      MOODLE_LANGUAGE: pt_br
      # Depois da instalação, a imagem executa o setup.php (idempotente): habilita o REST,
      # cria o serviço externo, o token, a disciplina de demonstração, os alunos e as tarefas
      WS_TOKEN: ${MOODLE_TOKEN:-reengajamento-local-token-es2-01}
      POST_CONFIGURE_COMMANDS: php /setup.php
    ports:
      - "8080:8080"
      # Porta do acompanhamento, que compartilha a rede deste contêiner (ver abaixo)
      - "8081:8081"
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html
      - ./moodle/setup.php:/setup.php:ro
    # Só fica saudável depois da instalação e do setup, quando o servidor web passa a responder
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/login/index.php"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  notificacoes:
    build: ./notificacoes
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      NOTIFICACOES_DB_URL: jdbc:h2:file:/data/notificacoes;AUTO_SERVER=TRUE
      NOTIFICACOES_REMETENTE: ${NOTIFICACOES_REMETENTE:-noreply@reengajamento.local}
      NOTIFICACOES_MAX_TENTATIVAS: ${NOTIFICACOES_MAX_TENTATIVAS:-5}
      NOTIFICACOES_INTERVALO_RETENTATIVA: ${NOTIFICACOES_INTERVALO_RETENTATIVA:-PT30S}
    volumes:
      - notificacoes-data:/data

  acompanhamento:
    build: ./acompanhamento
    # O Moodle só responde pelo endereço configurado em SITE_URL (localhost:8080).
    # Compartilhando a rede do contêiner do Moodle, "localhost:8080" aqui dentro
    # também é o Moodle, igual a quando o serviço roda direto na máquina.
    network_mode: service:moodle
    depends_on:
      rabbitmq:
        condition: service_healthy
      moodle:
        condition: service_healthy
    environment:
      MOODLE_URL: http://localhost:8080
      MOODLE_URL_PUBLICA: http://localhost:8080
      MOODLE_TOKEN: ${MOODLE_TOKEN:-reengajamento-local-token-es2-01}
      MOODLE_CURSO_ID: ${MOODLE_CURSO_ID:-2}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      ACOMPANHAMENTO_INTERVALO: ${ACOMPANHAMENTO_INTERVALO:-PT1M}

volumes:
  moodle-db:
  moodledata:
  moodlehtml:
  notificacoes-data:
